function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'

}

function norm(v) {
  return String(v ?? '').trim();
}

function initTabs() {
  const el = document.getElementById('tabs');
  Object.keys(DATA).forEach((name, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === 0 ? ' active' : '');
    b.textContent = name;

    el.appendChild(b);
  });
}

function setSheet(name, button) {
  current = name;

}

function addFilter() {
  const used = new Set(filters.map(f => f.col));
  const available = [0,1,2].filter(c => !used.has(c));
  if (!available.length) return;
  filters.push({col:available[0],text:""});
  renderFilters();
  render();
}

function removeFilter(i) {
  filters.splice(i,1);
  if (!filters.length) filters.push({col:0,text:""});
  renderFilters();
  render();
}

function changeCol(i,v) {
  filters[i].col = Number(v);
  filters[i].text = "";
  renderFilters();
  render();
}

function changeText(i,v) {
  filters[i].text = v;
  render();
}

function resetFilters() {
  filters = [{col:0,text:""}];
  renderFilters();
  render();
}

function renderFilters() {
  const d = DATA[current];
  let out = '<span class="filter-title">筛选维度</span>';

  filters.forEach((f,i) => {
    const vals = uniqueValues(f.col);
    const listId = 'dl_' + i;

    out += `<div class="filter-box">
      <select onchange="changeCol(${i},this.value)">
        ${[0,1,2].map(j => `<option value="${j}" ${j===f.col?'selected':''}>${esc(d.headers1[j])}</option>`).join('')}
      </select>
      <input list="${listId}" value="${esc(f.text)}" placeholder="输入文字匹配…" oninput="changeText(${i},this.value)">
      <datalist id="${listId}">
        ${vals.map(v => `<option value="${esc(v)}"></option>`).join('')}
      </datalist>
      ${filters.length>1 ? `<button class="remove" onclick="removeFilter(${i})" title="删除筛选">×</button>` : ''}
    </div>`;
  });

  out += '<button class="add-filter" onclick="addFilter()">＋ 添加筛选维度</button>';
  out += '<button class="reset" onclick="resetFilters()">重置</button>';
  out += '<span class="hint">输入文字可模糊匹配；多个维度同时生效</span>';

  document.getElementById('filters').innerHTML = out;
}

function render() {
  const d = DATA[current];
  let rows = d.rows.slice();

  // 仅筛选前三个业务维度；指标列绝不会进入筛选器。
  filters.forEach(f => {
    const q = norm(f.text).toLowerCase();
    if (q) {
      rows = rows.filter(r => norm(r[f.col]).toLowerCase().includes(q));
    }
  });

  if (!rows.length) {
    document.getElementById('table').innerHTML = '<div class="empty">没有匹配的数据</div>';
  } else {
    let out = '<table><thead><tr>';

    // 一级类目 / 二级类目 / 消耗分层：纵向合并
    for (let i=0; i<3; i++) {
      out += `<th rowspan="2">${esc(d.headers1[i])}</th>`;
    }

    // 指标组：横向合并
    d.groups.filter(g => g.start >= 3).forEach(g => {
      out += `<th colspan="${g.end-g.start+1}">${esc(g.name)}</th>`;
    });

    out += '</tr><tr>';

    for (let i=3; i<d.headers2.length; i++) {
      out += `<th>${esc(d.headers2[i])}</th>`;
    }

    out += '</tr></thead><tbody>';

    rows.forEach(r => {
      out += '<tr>';
      r.forEach(v => out += `<td>${esc(v)}</td>`);
      out += '</tr>';
    });

    out += '</tbody></table>';
    document.getElementById('table').innerHTML = out;
  }

  document.getElementById('count').textContent =
    '当前显示 ' + rows.length.toLocaleString() + ' 行';
}

initTabs();
renderFilters();
render();
</script>
</body>
</html>
